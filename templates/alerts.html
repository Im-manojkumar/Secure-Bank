{% extends "base.html" %}
{% block title %}Alerts{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Fraud alerts</h1>
    <p class="lede">Transactions the model flagged, highest risk first. Open one to review it.</p>
  </div>
</div>

<div class="tabs" role="group" aria-label="Filter by status" id="status-tabs">
  <button type="button" data-status="Open" aria-pressed="true">Open</button>
  <button type="button" data-status="Under Review" aria-pressed="false">Under review</button>
  <button type="button" data-status="Resolved" aria-pressed="false">Resolved</button>
  <button type="button" data-status="" aria-pressed="false">All</button>
</div>

<p id="alerts-error" role="alert" hidden></p>
<div class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Case</th><th>Status</th><th>Time</th><th class="num">Amount</th><th class="num">Risk score</th><th>Outcome</th><th>Reviewed by</th></tr>
      </thead>
      <tbody id="alerts-body"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="alerts-pager"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
{% endblock %}
